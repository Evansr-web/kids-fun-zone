<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kids Fun Zone 🎮</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#25234b;background:linear-gradient(135deg,#f1efff,#fff1f7,#e9fff6);min-height:100vh}header{text-align:center;padding:30px 16px 20px}h1{font-size:clamp(2.2rem,7vw,3.5rem);margin:12px 0}h1 span{color:#6758e8}header p{color:#77748e}.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px}.stat,.card,.panel{background:white;border-radius:20px;padding:14px;box-shadow:0 8px 25px #30266a12}.stat b{color:#6758e8}main{max-width:950px;margin:auto;padding:10px 16px 45px}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px}.card{border:0;text-align:left;color:inherit;cursor:pointer;padding:20px;transition:.2s}.card:hover{transform:translateY(-4px)}.icon{font-size:2.6rem}.card h2{margin:10px 0}.card p{color:#77748e}.play{font-weight:bold;color:#6758e8}.panel{display:none;margin-top:22px;padding:22px}.panel.active{display:block}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.top h2{margin:0}.question{text-align:center;font-size:2.1rem;font-weight:900;margin:22px 0}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:440px;margin:auto}.answer,input{border:2px solid #e5e1ff;border-radius:13px;padding:13px;font-size:1.1rem;font-weight:bold;text-align:center}.answer{background:#f8f7ff;cursor:pointer}.btn{display:block;margin:14px auto;background:#6758e8;color:white;border:0;border-radius:13px;padding:12px 18px;font-weight:bold;cursor:pointer}.close{border:0;border-radius:10px;padding:10px;background:#f0edff;cursor:pointer}.feedback{text-align:center;min-height:28px;font-weight:bold;margin-top:15px}.input{display:block;width:min(100%,360px);margin:auto}.memory{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:420px;margin:auto}.tile{border:0;border-radius:13px;background:#ece8ff;min-height:65px;font-size:1.8rem;cursor:pointer}.tile.matched{background:#d8fff0}footer{text-align:center;color:#77748e;padding:0 16px 25px}
</style></head>
<body>
<header><div>✨ LEARN • PLAY • GROW</div><h1>Kids <span>Fun Zone</span> 🎮</h1><p>Sharpen your brain, discover new words, and have fun learning!</p><div class="stats"><div class="stat">⭐ Stars: <b id="stars">0</b></div><div class="stat">🏆 Best streak: <b id="best">0</b></div><div class="stat">🎯 Games played: <b id="played">0</b></div></div></header>
<main><h2>Choose your adventure 🚀</h2><section class="games">
<button class="card" onclick="start('math')"><div class="icon">🧮</div><h2>Math Quest</h2><p>Solve number puzzles and earn stars.</p><div class="play">Play now →</div></button>
<button class="card" onclick="start('word')"><div class="icon">🔤</div><h2>Word Master</h2><p>Unscramble letters to find the hidden word.</p><div class="play">Play now →</div></button>
<button class="card" onclick="start('memory')"><div class="icon">🧠</div><h2>Memory Match</h2><p>Flip cards and find matching pictures.</p><div class="play">Play now →</div></button>
<button class="card" onclick="start('typing')"><div class="icon">⌨️</div><h2>Typing Race</h2><p>Type each word correctly to speed ahead.</p><div class="play">Play now →</div></button>
</section><section class="panel" id="panel"><div class="top"><h2 id="title">Let's play!</h2><button class="close" onclick="document.getElementById('panel').classList.remove('active')">✕ Close</button></div><div id="area"></div></section></main><footer>Made for curious minds 💜 Keep learning, one star at a time!</footer>
<script>
let stars=0,best=0,streak=0,played=0,answer='',wordIndex=0,typingIndex=0,first=null,matches=0,lock=false;
const words=[['TAC','CAT','A pet that says meow 🐱'],['NUS','SUN','It shines in the sky ☀️'],['KOOB','BOOK','You read it 📚'],['HSIF','FISH','It swims in water 🐟'],['EERT','TREE','It has leaves 🌳'],['LAPPE','APPLE','A crunchy fruit 🍎']];
const typing=['sunshine','rainbow','pencil','planet','garden','butterfly','amazing','computer'];
function stats(){document.getElementById('stars').textContent=stars;document.getElementById('best').textContent=best;document.getElementById('played').textContent=played}
function earned(ok){played++;if(ok){stars++;streak++;best=Math.max(best,streak)}else streak=0;stats()}
function start(g){document.getElementById('panel').classList.add('active');document.getElementById('panel').scrollIntoView({behavior:'smooth'});if(g==='math')math();if(g==='word')word();if(g==='memory')memory();if(g==='typing')type()}
function math(){document.getElementById('title').textContent='🧮 Math Quest';let a=1+Math.floor(Math.random()*12),b=1+Math.floor(Math.random()*12),op=Math.random()<.5?'+':'−';answer=String(op==='+'?a+b:a-b);let choices=[answer,String(Number(answer)+2),String(Number(answer)-1),String(Number(answer)+4)].sort(()=>Math.random()-.5);document.getElementById('area').innerHTML=`<div class="question">${a} ${op} ${b} = ?</div><div class="answers">${choices.map(x=>`<button class="answer" onclick="mathCheck('${x}')">${x}</button>`).join('')}</div><div class="feedback" id="feedback">Choose the correct answer!</div><button class="btn" onclick="math()">Next question →</button>`}
function mathCheck(v){let f=document.getElementById('feedback');if(f.dataset.done)return;f.dataset.done='1';if(v===answer){f.textContent='🎉 Correct! You earned a star!';earned(true)}else{f.textContent='The answer is '+answer+'. Try another!';earned(false)}}
function word(){document.getElementById('title').textContent='🔤 Word Master';let w=words[wordIndex++%words.length];answer=w[1];document.getElementById('area').innerHTML=`<p style="text-align:center">${w[2]}</p><div class="question">${w[0].split('').join(' ')}</div><input class="input" id="entry" placeholder="Type the word" maxlength="12"><div class="feedback" id="feedback">Unscramble the letters!</div><button class="btn" onclick="wordCheck()">Check word ✓</button>`;document.getElementById('entry').addEventListener('keydown',e=>{if(e.key==='Enter')wordCheck()})}
function wordCheck(){let f=document.getElementById('feedback');if(f.dataset.done)return;f.dataset.done='1';if(document.getElementById('entry').value.trim().toUpperCase()===answer){f.textContent='🌟 Great spelling! You earned a star!';earned(true)}else{f.textContent='Not quite! The word was '+answer+'. Try the next one.';earned(false)}document.querySelector('#area .btn').onclick=word;document.querySelector('#area .btn').textContent='Next word →'}
function memory(){document.getElementById('title').textContent='🧠 Memory Match';matches=0;first=null;lock=false;let a=['🐸','🐸','🦊','🦊','🐼','🐼','🦄','🦄','🐢','🐢','🐝','🐝'].sort(()=>Math.random()-.5);document.getElementById('area').innerHTML='<p style="text-align:center">Find all six matching pairs!</p><div class="memory">'+a.map((x,i)=>`<button class="tile" data-v="${x}" onclick="flip(this)">❔</button>`).join('')+'</div><div class="feedback" id="feedback">Pairs found: 0 / 6</div><button class="btn" onclick="memory()">Shuffle cards ↻</button>'}
function flip(b){if(lock||b.classList.contains('matched')||b.textContent!=='❔')return;b.textContent=b.dataset.v;if(!first){first=b;return}if(first.dataset.v===b.dataset.v){first.classList.add('matched');b.classList.add('matched');first=null;matches++;stars++;stats();document.getElementById('feedback').textContent=matches===6?'🏆 You found every pair! Bonus star earned!':'Pairs found: '+matches+' / 6';if(matches===6)earned(true)}else{lock=true;let prev=first;first=null;setTimeout(()=>{prev.textContent='❔';b.textContent='❔';lock=false},700)}}
function type(){document.getElementById('title').textContent='⌨️ Typing Race';answer=typing[typingIndex++%typing.length];document.getElementById('area').innerHTML=`<p style="text-align:center">Type the word below, then press Enter.</p><div class="question">${answer}</div><input class="input" id="entry" placeholder="Start typing..." autocomplete="off"><div class="feedback" id="feedback">Ready, set, type! 🏁</div><button class="btn" onclick="typeCheck()">Check typing ✓</button>`;document.getElementById('entry').focus();document.getElementById('entry').addEventListener('keydown',e=>{if(e.key==='Enter')typeCheck()})}
function typeCheck(){let f=document.getElementById('feedback');if(f.dataset.done)return;f.dataset.done='1';if(document.getElementById('entry').value===answer){f.textContent='🏁 Fast fingers! You earned a star!';earned(true)}else{f.textContent='Check every letter carefully. Try the next word!';earned(false)}document.querySelector('#area .btn').onclick=type;document.querySelector('#area .btn').textContent='Next word →'}
stats();
</script></body></html>
